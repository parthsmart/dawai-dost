<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<title>Dawai Dost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ FIRST LAUNCH: LANGUAGE ============ -->
<section id="langScreen" class="screen-full" hidden>
  <div class="lang-wrap">
    <div class="brand-big"><span class="brand-pill"></span> Dawai Dost</div>
    <p class="lang-q">अपनी भाषा चुनिये<br><span class="sub">Choose your language</span></p>
    <div class="lang-grid">
      <button class="lang-btn default" data-lang="hi">हिंदी<span>Hindi</span></button>
      <button class="lang-btn" data-lang="ta">தமிழ்<span>Tamil</span></button>
      <button class="lang-btn" data-lang="mr">मराठी<span>Marathi</span></button>
      <button class="lang-btn" data-lang="en">English<span>अंग्रेज़ी</span></button>
    </div>
    <button id="langMic" class="lang-mic" aria-label="Speak your language">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span>बोलकर चुनें · Speak</span>
    </button>
    <p id="langHeard" class="heard"></p>
  </div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-pill"></span><span id="brandName">Dawai Dost</span></div>
    <div id="clockChip" class="clock-chip"></div>
  </header>
  <div id="offlineBar" class="offline-bar" hidden></div>

  <main>
    <!-- HOME -->
    <section id="scr-home" class="scr">
      <div class="say-box" id="homeSay" aria-live="polite"></div>
      <button id="homeMic" class="mic-giant" aria-label="Mic">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <div class="mic-label" id="homeMicLabel"></div>
      <p class="heard" id="homeHeard"></p>
      <div id="homeQButtons" class="q-buttons" hidden></div>
      <h2 class="sec-title" id="todayTitle"></h2>
      <div id="todayList" class="dose-list"></div>
      <button id="homeSetup" class="btn-big btn-primary" hidden></button>
    </section>

    <!-- MEDICINES -->
    <section id="scr-meds" class="scr" hidden>
      <h2 class="sec-title" id="medsTitle"></h2>
      <div id="medList" class="med-list"></div>
      <button id="addMedBtn" class="btn-big btn-primary"></button>
    </section>

    <!-- FAMILY ALERTS -->
    <section id="scr-family" class="scr" hidden>
      <div class="wa">
        <div class="wa-head">
          <div class="wa-avatar" id="waAvatar">👪</div>
          <div><div class="wa-name" id="waName"></div><div class="wa-sub" id="waSub"></div></div>
        </div>
        <div class="wa-body" id="waBody"></div>
        <div class="wa-note" id="waNote"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="scr-settings" class="scr" hidden>
      <h2 class="sec-title" id="setTitle"></h2>

      <div class="card">
        <h3 id="setLangH"></h3>
        <div class="lang-grid small" id="setLangGrid">
          <button class="lang-btn" data-lang="hi">हिंदी</button>
          <button class="lang-btn" data-lang="ta">தமிழ்</button>
          <button class="lang-btn" data-lang="mr">मराठी</button>
          <button class="lang-btn" data-lang="en">English</button>
        </div>
      </div>

      <div class="card">
        <h3 id="setNamesH"></h3>
        <label><span id="lblUserName"></span><input id="inUserName" type="text"></label>
        <label><span id="lblFamCalls"></span><input id="inFamCalls" type="text"></label>
      </div>

      <div class="card">
        <h3 id="setFamH"></h3>
        <label><span id="lblFamName"></span><input id="inFamName" type="text" autocomplete="off"></label>
        <label><span id="lblFamPhone"></span><input id="inFamPhone" type="tel" inputmode="tel" autocomplete="off"></label>
      </div>

      <div class="card test-clock">
        <h3 id="setClockH"></h3>
        <div class="clock-now" id="clockNow"></div>
        <div class="row">
          <input id="inClock" type="time">
          <button id="btnSetClock" class="btn-mid"></button>
        </div>
        <div class="row wrap">
          <button class="btn-mid" data-add="1">+1 min</button>
          <button class="btn-mid" data-add="2">+2 min</button>
          <button class="btn-mid" data-add="15">+15 min</button>
          <button class="btn-mid" data-add="30">+30 min</button>
        </div>
        <div class="row wrap">
          <button id="btnNextDose" class="btn-mid btn-accent"></button>
          <button id="btnRealTime" class="btn-mid"></button>
        </div>
      </div>

      <div class="card">
        <h3 id="setVoiceH"></h3>
        <p class="hint" id="voiceHint"></p>
        <label><span>Wispr Flow API key</span><input id="inWispr" type="password" autocomplete="off" placeholder="platform.wisprflow.ai"></label>
        <label><span>Claude API key</span><input id="inClaude" type="password" autocomplete="off" placeholder="console.anthropic.com"></label>
        <p class="hint" id="engineStatus"></p>
      </div>

      <div class="card">
        <button id="btnReset" class="btn-mid btn-danger"></button>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" class="ic"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3Z"/></svg><span id="tabHome"></span></button>
    <button data-tab="meds"><svg viewBox="0 0 24 24" class="ic"><path d="M4.2 10.1a5 5 0 0 1 7.1-7.1l9.7 9.7a5 5 0 0 1-7.1 7.1l-9.7-9.7Zm1.4 1.4 4.3 4.3 5.9-5.9-4.3-4.3a3 3 0 0 0-4.2 0l-1.7 1.7a3 3 0 0 0 0 4.2Z"/></svg><span id="tabMeds"></span></button>
    <button data-tab="family"><svg viewBox="0 0 24 24" class="ic"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8a11 11 0 0 1-4.3-3.9c-.3-.5-1-1.5-1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg><span id="tabFamily"></span><b id="famBadge" class="badge" hidden></b></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" class="ic"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.8ZM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7Z"/></svg><span id="tabSettings"></span></button>
  </nav>
</div>

<!-- ============ TALK PANEL (voice setup) ============ -->
<section id="talk" class="screen-full talk" hidden>
  <div class="talk-top">
    <span id="talkTitle"></span>
    <button id="talkClose" class="x" aria-label="Close">✕</button>
  </div>
  <div class="talk-body">
    <div class="say-box big" id="talkSay" aria-live="polite"></div>
    <div id="talkCard"></div>
    <p class="heard" id="talkHeard"></p>
  </div>
  <div class="talk-foot">
    <button id="talkMic" class="mic-mid" aria-label="Mic">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <div id="talkButtons" class="talk-buttons"></div>
    <form id="talkTypeForm" class="type-form" hidden>
      <input id="talkType" type="text" autocomplete="off">
      <button class="btn-mid btn-primary" type="submit">➜</button>
    </form>
    <button id="talkTypeToggle" class="link-btn"></button>
  </div>
</section>

<!-- ============ REMINDER (full screen) ============ -->
<section id="reminder" class="screen-full reminder" hidden>
  <div class="rem-time" id="remTime"></div>
  <div class="rem-pill-wrap"><div id="remPill"></div></div>
  <div class="rem-label" id="remLabel"></div>
  <div class="rem-food" id="remFood"></div>
  <div class="say-box" id="remSay" aria-live="assertive"></div>
  <div class="rem-listen" id="remListen"></div>
  <p class="heard" id="remHeard"></p>
  <button id="remHearAgain" class="btn-mid" hidden>🔊</button>
  <div class="rem-buttons" id="remButtons" hidden>
    <button id="remTaken" class="btn-huge btn-taken"><span class="bi">✓</span><span id="remTakenTxt"></span></button>
    <button id="remLater" class="btn-huge btn-later"><span class="bi">⏰</span><span id="remLaterTxt"></span></button>
  </div>
  <div class="rem-demo">
    <span>Test clock:</span>
    <button data-add="2">+2 min</button>
    <button data-add="15">+15 min</button>
    <button data-add="30">+30 min</button>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
